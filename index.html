<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML accessibility check (demo)</title>
  <style>
    :root { color-scheme: light dark; --ink: #16171d; --paper: #f6f5f1; --muted: #5d5f66; --accent: #4540c9; --flag: #b42318; --rule: #d9d8d2; }
    @media (prefers-color-scheme: dark) { :root { --ink: #f2f1ec; --paper: #16171d; --muted: #a9abb2; --accent: #9b97f0; --flag: #ff8a80; --rule: #34363e; } }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height: 1.15; margin: 0 0 12px; }
    p { margin: 0 0 12px; }
    label { display: block; font-weight: 600; margin: 24px 0 6px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 240px; font: 14px/1.5 ui-monospace, monospace; padding: 12px; border: 1px solid var(--muted); border-radius: 6px; background: transparent; color: inherit; }
    button { margin-top: 12px; font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 6px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
    button:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .muted { color: var(--muted); font-size: 15px; }
    #status { margin-top: 16px; font-weight: 600; }
    ul.results { list-style: none; padding: 0; margin: 16px 0; }
    ul.results li { border-top: 1px solid var(--rule); padding: 12px 0; }
    .impact { font-size: 13px; font-weight: 600; color: var(--flag); text-transform: capitalize; }
    iframe { width: 100%; border: 1px solid var(--rule); border-radius: 6px; background: #fff; margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <h1>HTML accessibility check</h1>
  <p>Paste HTML. axe-core checks it in this tab against WCAG 2.0, 2.1 and 2.2 Level A and AA rules. Nothing is uploaded, and the pasted page's scripts do not run.</p>
  <p class="muted">Demo page for <code>check-html.js</code>. A styled version runs at <a href="https://suretto.com/tools/html-check">suretto.com/tools/html-check</a>.</p>

  <form id="form">
    <label for="html">Your HTML</label>
    <textarea id="html" spellcheck="false"><!doctype html>
<html><head><title>Sample</title></head>
<body>
  <img src="logo.png">
  <button><svg width="16" height="16"></svg></button>
  <p style="color:#999;background:#fff">Low-contrast text</p>
</body></html></textarea>
    <button type="submit">Check this HTML</button>
  </form>

  <p id="status" role="status" aria-live="polite"></p>
  <ul class="results" id="results"></ul>
  <iframe id="frame" sandbox="allow-same-origin" title="Rendered copy of your HTML" inert></iframe>
</main>

<script type="module">
  import { checkHtml } from './check-html.js';

  // axe-core 4.10.2 (MPL-2.0) from cdnjs. To work offline, save axe.min.js next to this page and fetch it from there.
  const loadAxeSource = () => fetch('https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.2/axe.min.js').then((r) => {
    if (!r.ok) throw new Error('Could not load axe-core.');
    return r.text();
  });

  const form = document.getElementById('form');
  const status = document.getElementById('status');
  const list = document.getElementById('results');
  const frame = document.getElementById('frame');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    list.replaceChildren();
    status.textContent = 'Checking…';
    try {
      const result = await checkHtml(frame, document.getElementById('html').value, { loadAxeSource });
      const issues = result.violations;
      status.textContent = issues.length ? `${issues.length} rule${issues.length === 1 ? '' : 's'} failed.` : 'No automated rule failed. Automated rules cannot judge everything; test with a keyboard and a screen reader too.';
      for (const v of issues) {
        const li = document.createElement('li');
        li.innerHTML = `<span class="impact"></span><br><strong></strong><br><span class="muted"></span>`;
        li.children[0].textContent = v.impact ?? 'issue';
        li.children[2].textContent = v.help;
        li.children[4].textContent = `${v.nodes.length} element${v.nodes.length === 1 ? '' : 's'} · rule ${v.id}`;
        list.append(li);
      }
    } catch (error) {
      status.textContent = error.message;
    }
  });
</script>
</body>
</html>
